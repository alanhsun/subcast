<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Anodized Graphite Hardware Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#18191B"/>
  <rect x="20" y="20" width="472" height="472" rx="104" stroke="#2E3035" stroke-width="4"/>

  <!-- Subtle Broadcast Grid Hairlines -->
  <line x1="88" y1="316" x2="424" y2="316" stroke="#2A2C30" stroke-width="3" stroke-linecap="round"/>

  <!-- Upper Zone: 5-Bar Live Broadcast Audio Waveform (Warm Titanium #EEEEB) -->
  <!-- Bar 1 -->
  <rect x="112" y="172" width="36" height="96" rx="18" fill="#EEEEB0" fill-opacity="0.72"/>
  <!-- Bar 2 -->
  <rect x="175" y="116" width="36" height="152" rx="18" fill="#EEEEEC"/>
  <!-- Bar 3 (Center Peak - Signal Orange) -->
  <rect x="238" y="84" width="36" height="184" rx="18" fill="#FF4A1F"/>
  <!-- Bar 4 -->
  <rect x="301" y="132" width="36" height="136" rx="18" fill="#EEEEEC"/>
  <!-- Bar 5 -->
  <rect x="364" y="184" width="36" height="84" rx="18" fill="#EEEEB0" fill-opacity="0.72"/>

  <!-- Lower Zone: Synchronized Bilingual Subtitle Tracks (Signal Orange #FF4A1F + Titanium) -->
  <!-- Primary Translated Caption Track -->
  <rect x="104" y="352" width="304" height="34" rx="17" fill="#FF4A1F"/>
  <!-- Secondary Original Language Caption Track -->
  <rect x="148" y="404" width="164" height="22" rx="11" fill="#94979C"/>
  <!-- Live Sync Indicator Dot -->
  <circle cx="348" cy="415" r="11" fill="#FF4A1F"/>
</svg>
